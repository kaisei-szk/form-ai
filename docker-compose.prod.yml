# ===============================================
# 本番用（VPS上で稼働）: n8n + playwright-service のみ
# Web UI本体は Vercel にデプロイするためここには含まない
#
# 起動: docker compose -f docker-compose.prod.yml up -d
# 停止: docker compose -f docker-compose.prod.yml down
#
# 事前に .env に以下を設定しておくこと:
#   N8N_HOST, WEBHOOK_URL, WEB_CALLBACK_URL, N8N_API_KEY, N8N_WORKFLOW_ID など
#   (.env.example 参照)
# ===============================================

services:

  # n8n ワークフローエンジン
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: form-ai-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=Asia/Tokyo
      - TZ=Asia/Tokyo
      # n8n Variables（ワークフロー内で $env.XXX で参照）
      - N8N_VARIABLES_INCLUDE_IN_PAYLOAD=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Web本体（Vercel）に完了通知を送るためのURL
      - WEB_CALLBACK_URL=${WEB_CALLBACK_URL}
      # Save execution data for debugging
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      # Disable task runner to avoid race condition on restart
      - N8N_RUNNERS_ENABLED=false
      # HTTP Request node timeout (default 10s is too short for bulk search)
      - HTTP_TIMEOUT_MS=600000
    env_file:
      - .env
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/home/node/.n8n/workflows-import   # ワークフローJSONの自動インポート用
      - ./config:/home/node/config:ro
    depends_on:
      - playwright-service
    networks:
      - form-ai-net

  # Playwright フォーム送信サービス
  playwright-service:
    build:
      context: ./playwright-service
      dockerfile: Dockerfile
    container_name: form-ai-playwright
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - PLAYWRIGHT_SERVICE_PORT=3002
      - SENDER_NAME=${SENDER_NAME:-株式会社REMEDY}
      - SENDER_EMAIL=${SENDER_EMAIL:-}
      - SENDER_COMPANY=${SENDER_COMPANY:-株式会社REMEDY}
    networks:
      - form-ai-net

volumes:
  n8n_data:
    driver: local

networks:
  form-ai-net:
    driver: bridge
